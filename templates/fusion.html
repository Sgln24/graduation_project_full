<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>LectureSeek · Lecture Fusion</title>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app-page">
    {% set active = "/fusion" %}{% include "_app_bar.html" %}
    <main class="page">
        <header class="page-header">
            <span class="eyebrow">AI tools</span>
            <h1>Lecture Fusion</h1>
            <p>Combine up to five saved lectures and source documents into one synthesized lecture with a slide deck and PDF.</p>
        </header>

        <div id="fusionRuntime" class="alert alert-info" role="status" aria-live="polite"></div>

        <section class="card" aria-labelledby="fusionSourcesTitle">
            <h2 id="fusionSourcesTitle">1. Choose sources</h2>
            <fieldset class="field" style="border:0;padding:0;margin:0 0 14px">
                <legend>Saved lectures <span class="field-hint">(maximum 5)</span></legend>
                <div id="fusionVideos" class="option-list" aria-live="polite"></div>
            </fieldset>
            <label class="field" for="fusionFiles">Source documents
                <input id="fusionFiles" type="file" multiple accept=".txt,.md,.docx,.pdf,.pptx">
                <span class="field-hint">.txt, .md, .docx, .pdf or .pptx · 20 MB total</span>
            </label>
        </section>

        <section class="card" aria-labelledby="fusionRunTitle">
            <h2 id="fusionRunTitle">2. Create the fused lecture</h2>
            <label class="check" for="fusionCloud">
                <input id="fusionCloud" type="checkbox" checked>
                <span>Cloud fallback (Groq)
                    <small>Local Ollama is used first. Only if it is unavailable are excerpts of your sources sent to Groq (needs <code>GROQ_API_KEY</code>).</small>
                </span>
            </label>
            <div class="actions">
                <button id="fusionRunBtn" class="btn btn-primary" type="button">Create fused lecture</button>
            </div>
            <div id="fusionStatus" class="status" role="status" aria-live="polite"></div>
            <div id="fusionResult"></div>
        </section>
    </main>
    <script src="/static/js/app-ui.js"></script>
    <script src="/static/js/fusion.js?v=20261029"></script>
</body>
</html>
