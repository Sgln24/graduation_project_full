<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>LectureSeek · Resource Finder</title>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app-page">
    {% set active = "/resource-finder" %}{% include "_app_bar.html" %}
    <main class="page">
        <header class="page-header">
            <span class="eyebrow">AI tools</span>
            <h1>Resource Finder</h1>
            <p>Find real videos, courses, papers, books and websites for a topic or an uploaded document, ranked by relevance.</p>
        </header>

        <section class="card" aria-labelledby="resourceSearchTitle">
            <h2 id="resourceSearchTitle">Search</h2>
            <div class="field-row">
                <label class="field" for="resourceTopic">Topic
                    <input id="resourceTopic" type="text" maxlength="200" placeholder="e.g. neural networks, or a lecture topic">
                </label>
                <label class="field" for="resourceFile">Or analyze a document
                    <input id="resourceFile" type="file" accept=".txt,.md,.docx,.pdf,.pptx">
                </label>
            </div>
            <fieldset class="field" style="border:0;padding:0;margin:0 0 14px">
                <legend>Resource types</legend>
                <div class="chip-group">
                    <label class="check"><input type="checkbox" name="resourceType" value="video" checked> Videos</label>
                    <label class="check"><input type="checkbox" name="resourceType" value="course" checked> Courses</label>
                    <label class="check"><input type="checkbox" name="resourceType" value="paper" checked> Papers</label>
                    <label class="check"><input type="checkbox" name="resourceType" value="book" checked> Books</label>
                    <label class="check"><input type="checkbox" name="resourceType" value="website" checked> Websites</label>
                </div>
            </fieldset>
            <label class="check"><input id="resourceUseLlm" type="checkbox" checked> <span>Use AI for analysis and ranking</span></label>
            <label class="check" for="resourceCloudFallback">
                <input id="resourceCloudFallback" type="checkbox" checked>
                <span>Cloud fallback (Groq)
                    <small>Used only if the local model is unavailable; analyzed text is sent to Groq. Search providers always receive your search query.</small>
                </span>
            </label>
            <div class="actions">
                <button id="resourceSearchBtn" class="btn btn-primary" type="button">Find resources</button>
            </div>
        </section>

        <div id="resourceFinderStatus" class="status" role="status" aria-live="polite"></div>
        <div id="resourceFinderAlert" class="alert alert-info" role="alert"></div>

        <div id="resourceFinderFilters" class="card" hidden>
            <div class="field-row">
                <label class="field">Type<select id="resourceFilterType"><option value="">All types</option></select></label>
                <label class="field">Platform<select id="resourceFilterPlatform"><option value="">All platforms</option></select></label>
                <label class="field">Difficulty<select id="resourceFilterDifficulty"><option value="">All levels</option></select></label>
                <label class="field">Language<select id="resourceFilterLanguage"><option value="">All languages</option></select></label>
            </div>
        </div>
        <div id="resourceFinderResults" class="result-grid"></div>
        <div class="actions"><button id="resourceFinderMore" class="btn btn-secondary" type="button" hidden>Load more</button></div>
    </main>
    <script src="/static/js/app-ui.js"></script>
    <script src="/static/js/resource-finder.js?v=20261029"></script>
</body>
</html>
